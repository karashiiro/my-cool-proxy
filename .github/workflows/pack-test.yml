name: Pack Test

on:
  push:
  pull_request:
  workflow_call:

jobs:
  pack-test:
    name: Test package installation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack package
        working-directory: apps/gateway
        run: pnpm pack

      - name: Verify dashboard UI is in tarball
        working-directory: apps/gateway
        run: |
          TARBALL=$(ls karashiiro-my-cool-proxy-*.tgz)
          if ! tar -tzf "$TARBALL" | grep -q "package/dist/dashboard/index.html"; then
            echo "Dashboard UI files missing from tarball!"
            echo "Expected package/dist/dashboard/index.html but it was not found."
            echo "Tarball contents:"
            tar -tzf "$TARBALL" | grep dashboard || echo "(no dashboard files found)"
            exit 1
          fi
          echo "Dashboard UI files present in tarball."

      - name: Create test directory
        run: mkdir pack-test-install

      - name: Initialize test package.json
        working-directory: pack-test-install
        run: |
          cat > package.json << 'EOF'
          {
            "name": "pack-test",
            "version": "1.0.0",
            "type": "module"
          }
          EOF

      - name: Install packed tarball
        working-directory: pack-test-install
        run: npm install ../apps/gateway/karashiiro-my-cool-proxy-*.tgz

      - name: Test CLI help
        working-directory: pack-test-install
        run: npx my-cool-proxy --help

      - name: Create minimal test config
        working-directory: pack-test-install
        run: |
          mkdir -p test-config
          cat > test-config/config.json << 'EOF'
          {
            "transport": "http",
            "host": "localhost",
            "port": 3456,
            "mcpClients": {},
            "dashboard": {
              "port": 3457,
              "host": "localhost"
            }
          }
          EOF

      - name: Test server actually starts
        working-directory: pack-test-install
        env:
          CONFIG_PATH: ./test-config/config.json
        run: |
          # Start the server in background
          npx my-cool-proxy &
          SERVER_PID=$!

          # Wait for server to initialize (imports all deps including pino)
          sleep 3

          # Verify server is responding (400 is fine - means server is up, just not a valid MCP request)
          HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:3456/mcp)
          if [ "$HTTP_CODE" = "000" ]; then
            echo "Server failed to respond (connection refused)!"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "Server started and responded with HTTP $HTTP_CODE!"

          # Verify dashboard serves HTML
          DASH_BODY=$(curl --silent http://localhost:3457)
          if ! echo "$DASH_BODY" | grep -qi "<!doctype\|<html"; then
            echo "Dashboard did not return HTML content!"
            echo "Response body: $DASH_BODY"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "Dashboard is serving HTML content!"

          # Verify dashboard API responds with JSON
          API_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:3457/api/executions)
          if [ "$API_CODE" != "200" ]; then
            echo "Dashboard API returned unexpected status: $API_CODE"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "Dashboard API responded with HTTP 200!"

          kill $SERVER_PID 2>/dev/null || true
