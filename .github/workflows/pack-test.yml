name: Pack Test

on:
  push:
  pull_request:
  workflow_call:

jobs:
  pack-test:
    name: Test package installation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack package
        working-directory: apps/gateway
        run: pnpm pack

      - name: Create test directory
        run: mkdir pack-test-install

      - name: Initialize test package.json
        working-directory: pack-test-install
        run: |
          cat > package.json << 'EOF'
          {
            "name": "pack-test",
            "version": "1.0.0",
            "type": "module"
          }
          EOF

      - name: Install packed tarball
        working-directory: pack-test-install
        run: npm install ../apps/gateway/karashiiro-my-cool-proxy-*.tgz

      - name: Test CLI invocation
        working-directory: pack-test-install
        run: npx my-cool-proxy --help
