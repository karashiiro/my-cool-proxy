name: Pack Test

on:
  push:
  pull_request:
  workflow_call:

jobs:
  pack-test:
    name: Test package installation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify dashboard UI is in build output
        run: |
          if [ ! -f apps/gateway/dist/dashboard/index.html ]; then
            echo "Dashboard UI files missing from apps/gateway/dist/dashboard/"
            echo "Expected index.html but it was not found."
            exit 1
          fi
          echo "Dashboard UI files present in build output."

      - name: Pack package
        working-directory: apps/gateway
        run: pnpm pack

      - name: Create test directory
        run: mkdir pack-test-install

      - name: Initialize test package.json
        working-directory: pack-test-install
        run: |
          cat > package.json << 'EOF'
          {
            "name": "pack-test",
            "version": "1.0.0",
            "type": "module"
          }
          EOF

      - name: Install packed tarball
        working-directory: pack-test-install
        run: npm install ../apps/gateway/karashiiro-my-cool-proxy-*.tgz

      - name: Test CLI help
        working-directory: pack-test-install
        run: npx my-cool-proxy --help

      - name: Create minimal test config
        working-directory: pack-test-install
        run: |
          mkdir -p test-config
          cat > test-config/config.json << 'EOF'
          {
            "transport": "http",
            "host": "localhost",
            "port": 3456,
            "mcpClients": {}
          }
          EOF

      - name: Test server actually starts
        working-directory: pack-test-install
        env:
          CONFIG_PATH: ./test-config/config.json
        run: |
          # Start the server in background
          npx my-cool-proxy &
          SERVER_PID=$!

          # Wait for server to initialize (imports all deps including pino)
          sleep 3

          # Verify server is responding (400 is fine - means server is up, just not a valid MCP request)
          HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:3456/mcp)
          if [ "$HTTP_CODE" = "000" ]; then
            echo "Server failed to respond (connection refused)!"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "Server started and responded with HTTP $HTTP_CODE!"
          kill $SERVER_PID 2>/dev/null || true
