name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Validate (lint, typecheck, test)
        run: pnpm check

      - name: Pack package
        working-directory: apps/gateway
        run: pnpm pack

      - name: Create test directory
        run: mkdir pack-test-install

      - name: Initialize test package.json
        working-directory: pack-test-install
        run: |
          cat > package.json << 'EOF'
          {
            "name": "pack-test",
            "version": "1.0.0",
            "type": "module"
          }
          EOF

      - name: Install packed tarball
        working-directory: pack-test-install
        run: npm install ../apps/gateway/karashiiro-my-cool-proxy-*.tgz

      - name: Test CLI invocation
        working-directory: pack-test-install
        run: npx my-cool-proxy --help

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        working-directory: apps/gateway
